<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Telegram Storage Isolation Lab</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 13px;
            font-size: 16px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #eee;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<h1>Telegram Storage Isolation Lab</h1>

<p id="status">Проверяем...</p>

<button id="write">
    WRITE markers for current account
</button>

<button id="read">
    READ ONLY — do not overwrite
</button>

<button id="clear">
    CLEAR test markers
</button>

<pre id="result">
Аккаунт №1: нажми WRITE
</pre>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const result =
    document.getElementById("result");

const KEY =
    "account_isolation_test_2026";


document.getElementById("status").textContent =
    "Telegram WebApp version: " +
    tg.version +
    "\nDeviceStorage: " +
    (tg.DeviceStorage ? "YES" : "NO") +
    "\nSecureStorage: " +
    (tg.SecureStorage ? "YES" : "NO");


async function getAccountFingerprint() {

    try {

        const response = await fetch(
            "https://telegram-bug-lab.onrender.com/lab-check",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    initData: tg.initData,
                    sessionToken: null
                })
            }
        );

        const data =
            await response.json();

        return (
            data.current_telegram_account
            || "UNKNOWN"
        );

    } catch (e) {

        return "ERROR";
    }
}


function deviceSet(key, value) {

    return new Promise((resolve) => {

        if (!tg.DeviceStorage) {

            resolve({
                supported: false
            });

            return;
        }

        tg.DeviceStorage.setItem(
            key,
            value,
            (error, success) => {

                resolve({
                    supported: true,
                    error:
                        error || null,
                    success:
                        Boolean(success)
                });
            }
        );
    });
}


function deviceGet(key) {

    return new Promise((resolve) => {

        if (!tg.DeviceStorage) {

            resolve({
                supported: false,
                value: null
            });

            return;
        }

        tg.DeviceStorage.getItem(
            key,
            (error, value) => {

                resolve({
                    supported: true,
                    error:
                        error || null,
                    value:
                        value ?? null
                });
            }
        );
    });
}


function deviceRemove(key) {

    return new Promise((resolve) => {

        if (!tg.DeviceStorage) {

            resolve(false);

            return;
        }

        tg.DeviceStorage.removeItem(
            key,
            () => resolve(true)
        );
    });
}


function secureSet(key, value) {

    return new Promise((resolve) => {

        if (!tg.SecureStorage) {

            resolve({
                supported: false
            });

            return;
        }

        tg.SecureStorage.setItem(
            key,
            value,
            (error, success) => {

                resolve({
                    supported: true,
                    error:
                        error || null,
                    success:
                        Boolean(success)
                });
            }
        );
    });
}


function secureGet(key) {

    return new Promise((resolve) => {

        if (!tg.SecureStorage) {

            resolve({
                supported: false,
                value: null,
                canRestore: false
            });

            return;
        }

        tg.SecureStorage.getItem(
            key,
            (
                error,
                value,
                canRestore
            ) => {

                resolve({
                    supported: true,

                    error:
                        error || null,

                    value:
                        value ?? null,

                    canRestore:
                        Boolean(canRestore)
                });
            }
        );
    });
}


function secureRemove(key) {

    return new Promise((resolve) => {

        if (!tg.SecureStorage) {

            resolve(false);

            return;
        }

        tg.SecureStorage.removeItem(
            key,
            () => resolve(true)
        );
    });
}



document.getElementById("write").onclick =
    async () => {

    result.textContent =
        "Writing...";

    const account =
        await getAccountFingerprint();

    const marker =
        "OWNER-" +
        account +
        "-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2, 9);


    localStorage.setItem(
        KEY,
        marker
    );


    const device =
        await deviceSet(
            KEY,
            marker
        );


    const secure =
        await secureSet(
            KEY,
            marker
        );


    result.textContent =
`
✅ WRITE COMPLETE

Current Telegram account:
${account}

Test marker:
${marker}

Browser localStorage:
WRITTEN

DeviceStorage:
${JSON.stringify(device, null, 2)}

SecureStorage:
${JSON.stringify(secure, null, 2)}


NEXT:

1. Закрой Mini App
2. Переключись на аккаунт №2
3. Открой тот же Mini App
4. НЕ нажимай WRITE
5. Нажми READ ONLY
`;
};



document.getElementById("read").onclick =
    async () => {

    result.textContent =
        "Reading...";

    const account =
        await getAccountFingerprint();


    const localValue =
        localStorage.getItem(
            KEY
        );


    const device =
        await deviceGet(
            KEY
        );


    const secure =
        await secureGet(
            KEY
        );


    result.textContent =
`
CURRENT TELEGRAM ACCOUNT:
${account}


======== localStorage ========

${localValue ?? "NONE"}


======== DeviceStorage ========

Supported:
${device.supported}

Error:
${device.error ?? "NONE"}

Value:
${device.value ?? "NONE"}


======== SecureStorage ========

Supported:
${secure.supported}

Error:
${secure.error ?? "NONE"}

Value:
${secure.value ?? "NONE"}

Can restore:
${secure.canRestore}


==============================

ВАЖНО:

Если DeviceStorage или SecureStorage
содержит OWNER другого аккаунта,
НЕ нажимай CLEAR.
Сохрани этот результат.
`;
};



document.getElementById("clear").onclick =
    async () => {

    localStorage.removeItem(
        KEY
    );

    await deviceRemove(
        KEY
    );

    await secureRemove(
        KEY
    );

    result.textContent =
        "✅ Test markers cleared";
};

</script>

</body>
</html>
